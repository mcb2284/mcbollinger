<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael Bollinger - Portfolio</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header>
            <nav>
                <h1>Michael Bollinger</h1>
                <div class="nav-links">
                    <button hx-get="about.html" hx-target="#content" hx-swap="innerHTML">About</button>
                    <button hx-get="projects.html" hx-target="#content" hx-swap="innerHTML">Projects</button>
                    <button hx-get="contact.html" hx-target="#content" hx-swap="innerHTML">Contact</button>
                </div>
            </nav>
        </header>

        <main id="content">
            <section id="hero">
                <h2>Welcome to My Portfolio</h2>
                <p>Full Stack Developer & Software Engineer</p>
                <button hx-get="about.html" hx-target="#content" hx-swap="innerHTML" class="cta-button">
                    Learn More About Me
                </button>
            </section>
        </main>
    </div>
</body>
</html>
